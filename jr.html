function fmt(hm){return hm?`${pad(hm[0])}:${pad(hm[1])}`:'—';}
let currentDayMode='wd',showAllElements=false,customTotalMinutes=null;
function getNowSeconds(){ if(customTotalMinutes!==null){const now=new Date();return customTotalMinutes*60+(now.getSeconds()%60);} const now=new Date();return now.getHours()*3600+now.getMinutes()*60+now.getSeconds(); }
function setDay(d){currentDayMode=d;showAllElements=false;document.getElementById('t-wd').className='tab'+(d==='wd'?' a-wd':'');document.getElementById('t-hd').className='tab'+(d==='hd'?' a-hd':'');render();}
function onTimeChange(){const value=document.getElementById('time-input').value;if(!value){customTotalMinutes=null;}else{const [h,m]=value.split(':').map(Number);customTotalMinutes=h*60+m;}showAllElements=false;render();}
function resetTime(){customTotalMinutes=null;const now=new Date();document.getElementById('time-input').value=`${pad(now.getHours())}:${pad(now.getMinutes())}`;showAllElements=false;render();}
function getItems(){const currentSec=getNowSeconds();return TIMETABLE[currentDayMode].map(row=>{let busDepSec=row.dep[0]*3600+row.dep[1]*60;let diff=busDepSec-currentSec;if(diff<-43200)diff+=86400;else if(diff>43200)diff-=86400;return {...row,diff:diff};}).filter(row=>row.diff>-120).sort((a,b)=>a.diff-b.diff);}
function cdText(diff,big=false){ if(diff<0)return ['発車済',big?'ncd-g':'cd-d']; if(diff<60)return [`${diff}秒`,big?'ncd-r':'cd-r']; if(diff<300){const m=Math.floor(diff/60),s=diff%60;return [`${m}分${s}秒`,big?'ncd-y':'cd-y'];} return [`${Math.floor(diff/60)}分`,big?'ncd-g':'cd-g']; }
function viaText(bus){ if(bus.line==='岐南線')return '加納駅前・名鉄岐阜経由'; if(isRapid(bus.type))return '清流ライナー・快速系統'; return '名鉄岐阜・徹明町・忠節経由'; }
function render(){const items=getItems();const nextBus=items[0];const nc=document.getElementById('next-card');if(!nextBus){nc.innerHTML='<div style="border:1px solid #1a1a1a;border-radius:10px;text-align:center;color:#333;padding:20px;margin-bottom:10px">本日の運行は終了しました</div>';document.getElementById('rows').innerHTML='';return;}
const rapidFlag=isRapid(nextBus.type),lineStyle=LINE_STYLES[nextBus.line],typeStyle=getTypeStyle(nextBus.type);const [countdownText,countdownClass]=cdText(nextBus.diff,true);const gridColumns=nextBus.hosp?4:3;const hospitalHtml=nextBus.hosp?`<div class="nti"><div class="nti-lbl">病院 着</div><div class="nti-val arr-h">${fmt(nextBus.hosp)}</div></div>`:'';const durationHtml=nextBus.dur?`<div class="nti"><div class="nti-lbl">所要時間</div><div class="nti-val dur-v">${nextBus.dur}分</div></div>`:'';
nc.innerHTML=`<div class="next-card ${lineStyle.cardClass}"><div class="next-label" style="color:${lineStyle.tc}"><span class="next-dot" style="background:${lineStyle.tc}"></span>次の便</div><div class="next-badges"><span class="badge" style="background:${lineStyle.bg};color:${lineStyle.tc};font-size:11px">${nextBus.line}</span><span class="badge" style="background:${typeStyle.bg};color:${typeStyle.tc};font-size:11px">${getLabel(nextBus.type)}</span>${rapidFlag?`<span style="color:#4ade80;font-size:10px">★速達系統</span>`:''}</div><div class="next-dest">${nextBus.dest}方面</div><div class="next-via">${viaText(nextBus)}　${nextBus.sys?nextBus.sys:''}</div><div class="next-times" style="grid-template-columns:repeat(${gridColumns},1fr)"><div class="nti"><div class="nti-lbl">ＪＲ岐阜 発</div><div class="nti-val dep">${fmt(nextBus.dep)}</div></div><div class="nti"><div class="nti-lbl">大学 着</div><div class="nti-val arr-u">${fmt(nextBus.univ)}</div></div>${hospitalHtml}${durationHtml}</div><div class="next-cd-row"><span class="next-cd ${countdownClass}">${countdownText}</span></div></div>`;
const rest=items.slice(1),visible=showAllElements?rest.slice(0,18):rest.slice(0,8),hasMore=rest.length>8&&!showAllElements;let rowsHtml=visible.map(bus=>{const ls=LINE_STYLES[bus.line],ts=getTypeStyle(bus.type);let rowClass='row-item',statusBadge;const [remainingText,colorClass]=cdText(bus.diff,false);if(bus.diff<0){rowClass+=' gone';statusBadge='<span class="st" style="background:#141414;color:#2a2a2a">済</span>';}else if(bus.diff<60){rowClass+=' hl2';statusBadge='<span class="st" style="background:#3a0808;color:#ef4444">まもなく</span>';}else if(bus.diff<300){rowClass+=' hl1';statusBadge=`<span class="st" style="background:#1e1600;color:#fbbf24">${Math.floor(bus.diff/60)}分後</span>`;}else{statusBadge=`<span class="st" style="background:${ls.bg};color:${ls.tc}">定刻</span>`;}const durationTd=bus.dur?`<div class="tv-d">${bus.dur}分</div>`:'<div class="tv-na">—</div>';return `<div class="${rowClass}"><div><span class="badge" style="background:${ls.bg};color:${ls.tc};font-size:9px">${bus.line==='岐南線'?'岐南':'病院'}</span></div><div><span class="badge" style="background:${ts.bg};color:${ts.tc};font-size:9px">${getLabel(bus.type)}</span></div><div><div class="dest-m">${bus.dest}</div><div class="dest-s">${viaText(bus)}</div></div><div class="tv">${fmt(bus.dep)}</div><div class="tv-u">${fmt(bus.univ)}</div><div class="tv-h">${fmt(bus.hosp)}</div>${durationTd}<div class="cd ${colorClass}">${remainingText}</div><div>${statusBadge}</div></div>`;}).join('');if(hasMore)rowsHtml+=`<div class="more-btn" onclick="showAllElements=true;render()">▼ 以降 ${rest.length-8} 便を表示</div>`;document.getElementById('rows').innerHTML=rowsHtml;}
function tick(){const now=new Date();document.getElementById('clk').textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;const days=['日','月','火','水','木','金','土'];document.getElementById('clk-d').textContent=`${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}（${days[now.getDay()]}）`;render();}
const initDate=new Date();document.getElementById('time-input').value=`${pad(initDate.getHours())}:${pad(initDate.getMinutes())}`;if(initDate.getDay()===0||initDate.getDay()===6){setDay('hd');}else{setDay('wd');}tick();setInterval(tick,1000);
</script>
</body>
</html>
